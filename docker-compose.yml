name: israel-utility-exporter

services:
  israel-utility-exporter:
    image: aransh/israel-utility-exporter:latest
    restart: unless-stopped
    environment:
      # --- General ---
      # - PORT=9877
      # - DATA_DIR=/data
      # - LOG_LEVEL=info
      # - WEB_CONFIG_FILE=/data/web-config.yml

      # --- Water (Read Your Meter Pro) ---
      - WATER_ENABLED=false
      - WATER_EMAIL=
      - WATER_PASSWORD=
      # - WATER_POLL_INTERVAL_MINUTES=90
      # - WATER_WEEKLY_WINDOW=sunday
      # - WATER_PRICE_PER_CUBIC_METER=

      # --- Electricity (IEC) ---
      - ELECTRICITY_ENABLED=false
      - ELECTRICITY_ID=
      # - ELECTRICITY_TOKEN_FILE=/data/iec-token.json
      # - ELECTRICITY_POLL_INTERVAL_MINUTES=60
      # - ELECTRICITY_TARIFF_MODE=flat
      # - ELECTRICITY_PRICE_PER_KWH=
      # - ELECTRICITY_TARIFF_SCHEDULE_FILE=/data/tariff-schedule.json
    volumes:
      - exporter-data:/data

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml.example:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - israel-utility-exporter

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

volumes:
  exporter-data:
  prometheus-data:
  grafana-data:
