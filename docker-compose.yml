name: israel-utility-exporter

services:
  israel-utility-exporter:
    image: aransh/israel-utility-exporter:latest
    restart: unless-stopped
    environment:
      # --- General ---
      # - PORT=9877
      # - DATA_DIR=/data
      # - LOG_LEVEL=info
      # - WEB_CONFIG_FILE=/data/web-config.yml

      # --- Water (Read Your Meter Pro) ---
      - WATER_ENABLED=false
      - WATER_EMAIL=
      - WATER_PASSWORD=
      # - WATER_POLL_INTERVAL_MINUTES=90
      # - WATER_WEEKLY_WINDOW=sunday
      # - WATER_TARIFF_MODE=flat
      # - WATER_PRICE_PER_CUBIC_METER=
      # - WATER_TARIFF_EXCESS_PRICE_PER_CUBIC_METER=
      # - WATER_TARIFF_HOUSEHOLD_SIZE=
      # - WATER_TARIFF_ALLOWANCE_PER_PERSON_CUBIC_METERS=

      # --- Electricity (IEC) ---
      - ELECTRICITY_ENABLED=false
      - ELECTRICITY_ID=
      # - ELECTRICITY_TOKEN_FILE=/data/iec-token.json
      # - ELECTRICITY_POLL_INTERVAL_MINUTES=60
      # - ELECTRICITY_TARIFF_MODE=flat
      # - ELECTRICITY_PRICE_PER_KWH=
      # - ELECTRICITY_TARIFF_SCHEDULE_FILE=/data/tariff-schedule.json

      # --- Historical data backfill (only used by `backfill-cli.js`, not the running exporter) ---
      # - REMOTE_WRITE_URL=http://prometheus:9090/api/v1/write
      # Must match the job_name/target below, or backfilled and scraped data
      # land as separate series (Prometheus assigns job/instance at scrape
      # time — they're not part of /metrics).
      # - REMOTE_WRITE_EXTRA_LABELS=job=israel-utility-exporter,instance=israel-utility-exporter:9877
      # - REMOTE_WRITE_USERNAME=
      # - REMOTE_WRITE_PASSWORD=
      # - REMOTE_WRITE_BEARER_TOKEN=
      # - REMOTE_WRITE_TLS_CA_FILE=/data/remote-write-ca.pem
      # - REMOTE_WRITE_TLS_INSECURE_SKIP_VERIFY=false
    volumes:
      - exporter-data:/data
    # Backfill is a one-off command, not a persistent service — run it against
    # this same container/volume, e.g.:
    #   docker compose run --rm israel-utility-exporter node dist/backfill-cli.js --service all --days 90 --dry-run

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    # To backfill into this Prometheus directly (rather than an external
    # remote_write-compatible receiver), add `--web.enable-remote-write-receiver`
    # to its command and point REMOTE_WRITE_URL above at
    # http://prometheus:9090/api/v1/write.
    volumes:
      - ./prometheus/prometheus.yml.example:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - israel-utility-exporter

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

volumes:
  exporter-data:
  prometheus-data:
  grafana-data:
