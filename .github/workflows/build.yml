name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets docker-release.yml gate a publish on exactly these checks.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test # lint + build + unit tests

  # Catches a broken Dockerfile (or a missing file it needs) on every push/PR,
  # without pushing anything. Shares a cache scope with docker-release.yml's
  # real build so a release doesn't redo this same layer work from scratch.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=israel-utility-exporter-image
          cache-to: type=gha,mode=max,scope=israel-utility-exporter-image
